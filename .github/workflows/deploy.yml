name: Deploy Social Suite to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Executing remote ssh commands using ssh key
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
          cd /var/www/SocialSuiteGoogleAIStudio
          git fetch origin main
          git reset --hard origin/main
          git clean -fd -e .env -e data/
          npm install --legacy-peer-deps
          npm run build
          sed -i 's/\b3000\b/3002/g' dist/server.cjs 2>/dev/null || true
          sed -i 's/\b3001\b/3002/g' dist/server.cjs 2>/dev/null || true
          sed -i 's/\b3e3\b/3002/g' dist/server.cjs 2>/dev/null || true
          sed -i '1s/^/process.env.PORT = "3002";\n/' dist/server.cjs 2>/dev/null || true
          PORT=3002 pm2 restart social-suite --update-env || PORT=3002 pm2 start dist/server.cjs --name "social-suite" --update-env
          pm2 save
