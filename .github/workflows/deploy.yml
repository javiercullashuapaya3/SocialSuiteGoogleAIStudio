name: Deploy Social Suite to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Executing remote ssh commands using ssh key
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
          cd /var/www/SocialSuiteGoogleAIStudio
          
          # 1. Sincronizar cambios de Google AI Studio
          git fetch origin main
          git reset --hard origin/main
          
          # 2. Forzar enlace simbolico al centro maestro de Supabase
          ln -sf /etc/promptia/supabase.env .env

          # 3. Instalar librerías y compilar Vite
          npm install --legacy-peer-deps
          npm run build
          
          # 4. Garantizar siempre la existencia de server.cjs
          cat << 'INNER_EOF' > server.cjs
          const express = require('express');
          const path = require('path');
          const app = express();
          const PORT = process.env.PORT || 3002;

          app.use(express.static(path.join(__dirname, 'dist')));

          app.get('*', (req, res) => {
            res.sendFile(path.join(__dirname, 'dist', 'index.html'));
          });

          app.listen(PORT, '0.0.0.0', () => {
            console.log(`Social Suite corriendo en http://0.0.0.0:${PORT}`);
          });
          INNER_EOF
          
          # 5. Reiniciar o levantar en PM2
          PORT=3002 pm2 restart social-suite --update-env || PORT=3002 pm2 start server.cjs --name "social-suite" --update-env
          pm2 save
